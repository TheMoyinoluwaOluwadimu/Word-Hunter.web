<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="felt" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#27806a"/>
      <stop offset="1" stop-color="#175848"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#felt)"/>

  <!-- confetti bits -->
  <rect x="150" y="96" width="26" height="26" rx="6" fill="#f5b91e" transform="rotate(18 163 109)"/>
  <rect x="1010" y="70" width="20" height="20" rx="5" fill="#2e6fd8" transform="rotate(-14 1020 80)"/>
  <rect x="1060" y="300" width="28" height="28" rx="6" fill="#e34a33" transform="rotate(30 1074 314)"/>
  <rect x="104" y="360" width="20" height="20" rx="5" fill="#f08a24" transform="rotate(-28 114 370)"/>
  <rect x="236" y="540" width="18" height="18" rx="4" fill="#2e6fd8" transform="rotate(12 245 549)"/>
  <rect x="960" y="520" width="22" height="22" rx="5" fill="#f5b91e" transform="rotate(-20 971 531)"/>

  <!-- WORD -->
  <g font-family="Lilita One" font-size="118" text-anchor="middle">
    <g transform="rotate(-3 504 135)">
      <rect x="354" y="76" width="300" height="150" rx="30" fill="#a3321f"/>
      <rect x="354" y="60" width="300" height="150" rx="30" fill="#e34a33"/>
      <rect x="366" y="68" width="276" height="26" rx="13" fill="#ffffff" opacity="0.2"/>
      <text x="504" y="178" fill="#fff4dc">WOR</text>
    </g>
    <g transform="rotate(3 761 135)">
      <rect x="676" y="76" width="170" height="150" rx="30" fill="#b88410"/>
      <rect x="676" y="60" width="170" height="150" rx="30" fill="#f5b91e"/>
      <rect x="688" y="68" width="146" height="26" rx="13" fill="#ffffff" opacity="0.28"/>
      <text x="761" y="178" fill="#4a2a12">D</text>
    </g>

    <!-- CHUNK -->
    <g transform="rotate(2 378 307)">
      <rect x="263" y="248" width="230" height="150" rx="30" fill="#1b4a9a"/>
      <rect x="263" y="232" width="230" height="150" rx="30" fill="#2e6fd8"/>
      <rect x="275" y="240" width="206" height="26" rx="13" fill="#ffffff" opacity="0.2"/>
      <text x="378" y="350" fill="#fff4dc">CH</text>
    </g>
    <g transform="rotate(-2 630 307)">
      <rect x="515" y="248" width="230" height="150" rx="30" fill="#1b6b45"/>
      <rect x="515" y="232" width="230" height="150" rx="30" fill="#2f9d6a"/>
      <rect x="527" y="240" width="206" height="26" rx="13" fill="#ffffff" opacity="0.2"/>
