  <g font-family="Lilita One" text-anchor="middle">
    <text x="600" y="487" font-size="56" fill="#fff4dc">Build words from chunks</text>
    <text x="600" y="548" font-size="31" fill="#e8d8b8">A new word puzzle every day. Race your friends.</text>
