    </g>
    <g transform="rotate(-3 852 307)">
      <rect x="767" y="248" width="170" height="150" rx="30" fill="#b3600f"/>
      <rect x="767" y="232" width="170" height="150" rx="30" fill="#f08a24"/>
      <rect x="779" y="240" width="146" height="26" rx="13" fill="#ffffff" opacity="0.26"/>
      <text x="852" y="350" fill="#4a2a12">K</text>
    </g>
