<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6b57" />
    <title>WordChunk · Daily word puzzle</title>
    <meta
      name="description"
      content="Build words from chunks. A new word puzzle every day, with streaks, friend challenges and a leaderboard."
    />

    <!-- browser tab, home screen and app icons (made from brand/, see brand/make-assets.mjs) -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="WordChunk" />

    <!-- link previews (WhatsApp, iMessage, Slack, X, Facebook ...). __SITE_URL__ is filled in at build time, see vite.config.ts -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WordChunk" />
    <meta property="og:title" content="WordChunk · Daily word puzzle" />
    <meta property="og:description" content="Build words from chunks. A new puzzle every day. Race your friends." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WordChunk: the words WORD and CHUNK built from painted tiles" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WordChunk · Daily word puzzle" />
    <meta name="twitter:description" content="Build words from chunks. A new puzzle every day. Race your friends." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
